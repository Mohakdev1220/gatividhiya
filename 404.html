
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <meta name="robots" content="noindex, follow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 420px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    p {
      color: #9ca3af;
      font-size: 15px;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      background: #ffffff;
      color: #111827;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>This page doesn't exist.</h1>
    <p>The page you're looking for could not be found.</p>
    <a href="https://track.mohaktools.com/">Go to main page →</a>
  </main>
</body>
</html>
